name: industry-signal-pack
display_name: Industry Signal Pack
model: gpt-4o
temperature: 0.2
top_p: 0.95
description: 'Parameterized vertical context: what critical means, which control framework
  applies, which assets are safety-critical. One skill, many configs.'
instructions_file: instructions.md
tools:
- type: azure_ai_search
  name: search_knowledge
  index: agentic-itops-knowledge
  query_type: vector_semantic_hybrid
  top_k: 3
parameters:
  industry:
    type: string
    enum:
    - energy_utilities
    - manufacturing
    - financial_services
    - healthcare
    - retail_supply_chain
    - public_sector
    default: energy_utilities
identity:
  type: user_assigned_managed_identity
  required_roles:
  - Monitoring Reader
  - Reader
output_schema:
  type: object
  properties:
    status:
      type: string
      enum:
      - completed
      - insufficient_evidence
    citations:
      type: array
      items:
        type: object
        properties:
          source_id:
            type: string
            minLength: 1
          revision:
            type:
            - string
            - 'null'
          locator:
            type:
            - string
            - 'null'
        required:
        - source_id
        - revision
        - locator
        additionalProperties: false
      minItems: 0
    evidence_gaps: &id001
      type: array
      items:
        type: string
        minLength: 1
      minItems: 0
    industry:
      type: string
      enum:
      - energy_utilities
      - manufacturing
      - financial_services
      - healthcare
      - retail_supply_chain
      - public_sector
    criticality_adjustment:
      type: string
      minLength: 1
    control_frameworks: *id001
    safety_critical_asset_classes: *id001
    additional_prohibitions: *id001
  required:
  - status
  - citations
  - evidence_gaps
  - industry
  - criticality_adjustment
  - control_frameworks
  - safety_critical_asset_classes
  - additional_prohibitions
  additionalProperties: false

name: ops-orchestrator
display_name: Ops Orchestrator
model: gpt-4o
temperature: 0.2
top_p: 0.95

description: >
  Front door for the Agentic ITOps loop. Receives a normalized incident,
  delegates to specialist agents, assembles a recommendation, and hands
  the proposed action to the Change-Safety Gate. Never executes change.

# Logical specialist relationships. The approved trusted_dispatch compiler
# exposes no-argument delegation functions on this real Foundry coordinator;
# the trusted worker invokes exact specialist versions and validates each stage.
connected_agents:
  - rca-investigator
  - runbook-memory
  - remediation-planner
  - incident-comms

tools:
  - type: openapi
    name: signal_normalizer
    spec: ../../tools/openapi/signal-normalizer.yaml
    auth: managed_identity
  - type: openapi
    name: change_safety_gate
    spec: ../../tools/openapi/change-safety-gate.yaml
    auth: managed_identity

instructions_file: instructions.md

# Least privilege. The orchestrator reasons and routes; it holds no
# write permission on anything.
identity:
  type: user_assigned_managed_identity
  required_roles:
    - Monitoring Reader
    - Reader

output_schema:
  type: object
  additionalProperties: false
  required: [status, citations, evidence_gaps, incident_fingerprint, summary, hypotheses, proposed_action, gate_decision, handoff]
  properties:
    status: { type: string, enum: [completed, insufficient_evidence] }
    citations:
      type: array
      minItems: 0
      items:
        type: object
        additionalProperties: false
        required: [source_id, revision, locator]
        properties:
          source_id: { type: string, minLength: 1 }
          revision: { type: [string, "null"] }
          locator: { type: [string, "null"] }
    evidence_gaps:
      type: array
      minItems: 0
      items: { type: string, minLength: 1 }
    incident_fingerprint: { type: string, minLength: 1 }
    summary: { type: string, minLength: 1 }
    hypotheses:
      type: array
      minItems: 0
      items:
        type: object
        additionalProperties: false
        required: [hypothesis, confidence, evidence, contradicting_evidence, next_check]
        properties:
          hypothesis: { type: string, minLength: 1 }
          confidence: { type: string, enum: [high, medium, low, none] }
          evidence:
            type: array
            minItems: 1
            items: { type: string, minLength: 1 }
          contradicting_evidence:
            type: array
            minItems: 0
            items: { type: string, minLength: 1 }
          next_check: { type: string }
    proposed_action: { type: string, minLength: 1 }
    gate_decision: { type: string, enum: [allow, deny, escalate, not_evaluated] }
    handoff: { type: string }

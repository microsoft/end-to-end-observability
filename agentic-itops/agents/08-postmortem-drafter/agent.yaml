name: postmortem-drafter
display_name: Postmortem Drafter
model: gpt-4o
temperature: 0.3
top_p: 0.95
description: Drafts a blameless postmortem from the incident record and writes it back to
  the knowledge index, closing the learning loop.
instructions_file: instructions.md
tools:
- type: azure_ai_search
  name: search_knowledge
  index: agentic-itops-knowledge
  query_type: vector_semantic_hybrid
  top_k: 3
- type: openapi
  name: change_history
  spec: ../../tools/openapi/change-history.yaml
  auth: managed_identity
output_schema:
  type: object
  required:
  - summary
  - timeline
  - contributing_factors
  - actions
  properties:
    summary:
      type: string
    timeline:
      type: array
    contributing_factors:
      type: array
    what_made_it_slow:
      type: string
    actions:
      type: array
    lesson:
      type: string
identity:
  type: user_assigned_managed_identity
  required_roles:
  - Monitoring Reader
  - Reader

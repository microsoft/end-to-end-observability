name: runbook-memory
display_name: Runbook and Institutional Memory
model: gpt-4o
temperature: 0.2
top_p: 0.95
description: Answers whether this has been seen before, what was done about it, and what the
  documentation prohibits.
instructions_file: instructions.md
tools:
- type: azure_ai_search
  name: search_knowledge
  index: agentic-itops-knowledge
  query_type: vector_semantic_hybrid
  top_k: 3
identity:
  type: user_assigned_managed_identity
  required_roles:
  - Monitoring Reader
  - Reader
output_schema:
  type: object
  properties:
    status:
      type: string
      enum:
      - completed
      - insufficient_evidence
    citations:
      type: array
      items:
        type: object
        properties:
          source_id:
            type: string
            minLength: 1
          revision:
            type:
            - string
            - 'null'
          locator:
            type:
            - string
            - 'null'
        required:
        - source_id
        - revision
        - locator
        additionalProperties: false
      minItems: 0
    evidence_gaps: &id001
      type: array
      items:
        type: string
        minLength: 1
      minItems: 0
    runbooks:
      type: array
      items:
        type: object
        properties:
          doc_id:
            type: string
            minLength: 1
          revision:
            type: string
            minLength: 1
          title:
            type: string
            minLength: 1
          relevance:
            type: string
            enum:
            - strong
            - partial
            - weak
          documented_actions: *id001
          preconditions:
            type: string
          prohibitions: *id001
          excerpt:
            type: string
        required:
        - doc_id
        - revision
        - title
        - relevance
        - documented_actions
        - preconditions
        - prohibitions
        - excerpt
        additionalProperties: false
      minItems: 0
    postmortems:
      type: array
      items:
        type: object
        properties:
          doc_id:
            type: string
            minLength: 1
          revision:
            type: string
            minLength: 1
          title:
            type: string
            minLength: 1
          what_happened:
            type: string
          what_it_cost:
            type: string
          lesson:
            type: string
        required:
        - doc_id
        - revision
        - title
        - what_happened
        - what_it_cost
        - lesson
        additionalProperties: false
      minItems: 0
    coverage_gap:
      type: string
  required:
  - status
  - citations
  - evidence_gaps
  - runbooks
  - postmortems
  - coverage_gap
  additionalProperties: false

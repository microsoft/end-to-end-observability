name: incident-comms
display_name: Incident Communications
model: gpt-4o
temperature: 0.4
top_p: 0.95
description: Drafts audience-appropriate incident updates. Drafts only; never sends.
instructions_file: instructions.md
tools: []
identity:
  type: user_assigned_managed_identity
  required_roles:
  - Monitoring Reader
  - Reader
output_schema:
  type: object
  properties:
    status:
      type: string
      enum:
      - completed
      - insufficient_evidence
    citations:
      type: array
      items:
        type: object
        properties:
          source_id:
            type: string
            minLength: 1
          revision:
            type:
            - string
            - 'null'
          locator:
            type:
            - string
            - 'null'
        required:
        - source_id
        - revision
        - locator
        additionalProperties: false
      minItems: 0
    evidence_gaps: &id001
      type: array
      items:
        type: string
        minLength: 1
      minItems: 0
    engineer_update:
      type: string
      minLength: 1
    executive_update:
      type: string
      minLength: 1
    customer_update:
      type: string
    withheld: *id001
  required:
  - status
  - citations
  - evidence_gaps
  - engineer_update
  - executive_update
  - customer_update
  - withheld
  additionalProperties: false

name: triage-dedup
display_name: Triage and Deduplication
model: gpt-4o
temperature: 0.2
top_p: 0.95
description: Clusters normalized signals into a single incident, applies business-context
  severity, and suppresses known-noise patterns.
instructions_file: instructions.md
tools:
- type: openapi
  name: resource_graph
  spec: ../../tools/openapi/resource-graph.yaml
  auth: managed_identity
identity:
  type: user_assigned_managed_identity
  required_roles:
  - Monitoring Reader
  - Reader
output_schema:
  type: object
  properties:
    status:
      type: string
      enum:
      - completed
      - insufficient_evidence
    citations:
      type: array
      items:
        type: object
        properties:
          source_id:
            type: string
            minLength: 1
          revision:
            type:
            - string
            - 'null'
          locator:
            type:
            - string
            - 'null'
        required:
        - source_id
        - revision
        - locator
        additionalProperties: false
      minItems: 0
    evidence_gaps:
      type: array
      items:
        type: string
        minLength: 1
      minItems: 0
    incident_fingerprint:
      type: string
      minLength: 1
    adjusted_severity:
      type: string
      enum:
      - critical
      - high
      - medium
      - low
      - info
    severity_changed_because:
      type: string
      minLength: 1
    suppress:
      type: boolean
    reasoning:
      type: string
      minLength: 1
  required:
  - status
  - citations
  - evidence_gaps
  - incident_fingerprint
  - adjusted_severity
  - severity_changed_because
  - suppress
  - reasoning
  additionalProperties: false

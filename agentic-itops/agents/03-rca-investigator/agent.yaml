name: rca-investigator
display_name: RCA Investigator
model: gpt-4o
temperature: 0.2
top_p: 0.95
description: Forms ranked, evidence-backed root cause hypotheses using change history, telemetry
  and resource topology.
instructions_file: instructions.md
tools:
- type: openapi
  name: change_history
  spec: ../../tools/openapi/change-history.yaml
  auth: managed_identity
- type: openapi
  name: log_analytics
  spec: ../../tools/openapi/log-analytics.yaml
  auth: managed_identity
- type: openapi
  name: resource_graph
  spec: ../../tools/openapi/resource-graph.yaml
  auth: managed_identity
- type: mcp
  name: azure_monitor
  server_label: azure-monitor
  server_url: ${AZURE_MONITOR_MCP_URL}
  auth: managed_identity
  note: stub server in tools/mcp/azure_monitor_mcp_stub.py
identity:
  type: user_assigned_managed_identity
  required_roles:
  - Monitoring Reader
  - Reader
output_schema:
  type: object
  properties:
    status:
      type: string
      enum:
      - completed
      - insufficient_evidence
    citations:
      type: array
      items:
        type: object
        properties:
          source_id:
            type: string
            minLength: 1
          revision:
            type:
            - string
            - 'null'
          locator:
            type:
            - string
            - 'null'
        required:
        - source_id
        - revision
        - locator
        additionalProperties: false
      minItems: 0
    evidence_gaps: &id001
      type: array
      items:
        type: string
        minLength: 1
      minItems: 0
    hypotheses:
      type: array
      items:
        type: object
        properties:
          hypothesis:
            type: string
            minLength: 1
          confidence:
            type: string
            enum:
            - high
            - medium
            - low
            - none
          evidence:
            type: array
            items:
              type: string
              minLength: 1
            minItems: 1
          contradicting_evidence: *id001
          next_check:
            type: string
        required:
        - hypothesis
        - confidence
        - evidence
        - contradicting_evidence
        - next_check
        additionalProperties: false
      minItems: 0
    timeline:
      type: array
      items:
        type: object
        properties:
          at:
            type: string
            minLength: 1
          observation:
            type: string
            minLength: 1
        required:
        - at
        - observation
        additionalProperties: false
      minItems: 0
    notable_absence:
      type: string
  required:
  - status
  - citations
  - evidence_gaps
  - hypotheses
  - timeline
  - notable_absence
  additionalProperties: false

# -----------------------------------------------------------------------------
# AMBA Enterprise - Deployment Pipeline
# Deploys AMBA policy initiatives via Terraform per environment ring
# Sequence: validate → plan → apply (with manual approval for prod)
# -----------------------------------------------------------------------------
name: AMBA Deploy

on:
  push:
    branches: [main]
    paths:
      - 'amba-enterprise/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment ring'
        required: true
        type: choice
        options:
          - sandbox
          - pre-prod
          - prod

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: '1.9.0'
  WORKING_DIR: 'amba-enterprise/terraform'

jobs:
  validate:
    name: Validate Parameters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate subscription naming
        shell: pwsh
        run: ./amba-enterprise/scripts/validate-naming.ps1

      - name: Validate parameter governance
        shell: pwsh
        run: ./amba-enterprise/scripts/validate-parameters.ps1 -Environment ${{ inputs.environment || 'sandbox' }}

      - name: Check deployment budget
        shell: pwsh
        run: ./amba-enterprise/scripts/deployment-budget.ps1

  plan:
    name: Terraform Plan (${{ inputs.environment || 'sandbox' }})
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'sandbox' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=amba-${{ inputs.environment || 'sandbox' }}.tfstate"

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="environments/${{ inputs.environment || 'sandbox' }}.tfvars" \
            -var="management_subscription_id=${{ secrets.MANAGEMENT_SUBSCRIPTION_ID }}" \
            -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment || 'sandbox' }}
          path: ${{ env.WORKING_DIR }}/tfplan

  apply:
    name: Terraform Apply (${{ inputs.environment || 'sandbox' }})
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'sandbox' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment || 'sandbox' }}
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=amba-${{ inputs.environment || 'sandbox' }}.tfstate"

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply tfplan

  post-deploy-validation:
    name: Post-Deployment Validation
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Policy Assignments
        shell: pwsh
        run: |
          $assignments = az policy assignment list --scope "/providers/Microsoft.Management/managementGroups/${{ secrets.ENTERPRISE_PREFIX }}" --query "[?contains(displayName, 'AMBA')]" | ConvertFrom-Json
          Write-Host "Found $($assignments.Count) AMBA policy assignments"
          if ($assignments.Count -eq 0) { throw "No AMBA policy assignments found" }

      - name: Verify UAMI and Role Assignments
        shell: pwsh
        run: |
          $roleAssignments = az role assignment list --scope "/providers/Microsoft.Management/managementGroups/${{ secrets.ENTERPRISE_PREFIX }}" --query "[?contains(roleDefinitionName, 'Monitoring')]" | ConvertFrom-Json
          Write-Host "Found $($roleAssignments.Count) monitoring role assignments"

      - name: Verify APR Exists
        shell: pwsh
        run: |
          $aprs = az monitor alert-processing-rule list --subscription ${{ secrets.MANAGEMENT_SUBSCRIPTION_ID }} --query "[?contains(tags._deployed_by_amba, 'True')]" | ConvertFrom-Json
          Write-Host "Found $($aprs.Count) AMBA Alert Processing Rules"

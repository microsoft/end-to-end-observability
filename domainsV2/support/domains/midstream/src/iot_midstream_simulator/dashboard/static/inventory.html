        updatePlaybackControls();
        byId("playback-status").textContent = `${frame.label}. Synthetic elapsed ${frame.elapsed_minutes} minutes. ${focusLow} focus positions below 10.`;
      }

      function drawStory() {
        const movement = UI.payload.movement, frame = currentFrame(), focus = movement.focus[UI.focusIndex];
        byId("stage-clock").textContent = `Synthetic elapsed · ${frame.elapsed_minutes} min · Stage ${UI.index + 1} of ${movement.frames.length}`;
        byId("stage-title").textContent = frame.label;
        const copy = [
          "Start with the exact nominal opening position. Nothing has moved yet.",
          "A planned issue draws focus stock down to 12. The count is still above the minimum.",
          "Exactly 10 remains. The strict below-10 alert has not fired.",
          "At 9, the threshold is crossed. A portal-only low-stock preview fires.",
          "At zero, stock is explicitly unavailable. The same alert episode stays open.",
          "A receipt restores the exact opening quantity. The focus alert resolves.",
        ];
        byId("stage-copy").textContent = movement.available ? copy[UI.index] : (movement.unavailable_reason || "Movement is unavailable for this dataset. Opening inventory remains available below.");
        byId("timeline").innerHTML = movement.frames.map((item, index) => `<li class="${index <= UI.index ? "done" : ""}" ${index === UI.index ? 'aria-current="step"' : ""}><b>${String(index + 1).padStart(2, "0")}</b>${esc(item.label)}</li>`).join("");
        if (focus) {
          const row = frame.stock.find((item) => stockKey(item) === stockKey(focus));
          const opening = movement.frames[0].stock.find((item) => stockKey(item) === stockKey(focus));
          const max = Math.max(opening.quantity, movement.threshold, 1);
          const known = quantityStatus(row.quantity) !== "unknown";
          byId("focus-story").innerHTML = `<h3>${esc(focus.part_name)}</h3><div class="muted">${esc(focus.location_code)} <span class="pill focus">Scenario focus</span></div>
            <div class="focus-value"><div class="quantity" id="focus-quantity">${stockQuantity(row.quantity)}<small>${esc(focus.uom || "UOM unknown")}</small></div>${statusPill(row.quantity)}</div>
            <div class="gauge" role="img" aria-label="${esc(`Quantity ${known ? row.quantity : "unknown"} ${focus.uom || ""}; minimum ${movement.threshold}; opening ${opening.quantity}`)}"><div class="gauge-fill" style="width:${known ? Math.min(100, row.quantity / max * 100) : 0}%"></div><i class="gauge-min" style="left:${movement.threshold / max * 100}%"></i></div>
            <div class="gauge-caption"><span>0 ${esc(focus.uom)}</span><strong>Min ${movement.threshold} · alert &lt; ${movement.threshold}</strong><span>Opening ${num(opening.quantity)} ${esc(focus.uom)}</span></div>
            <button class="text-button" id="locate-focus" type="button" style="margin-top:16px">Locate this stock position →</button>`;
          byId("locate-focus").onclick = () => selectStock(stockKey(focus), true, true);
        } else {
          byId("focus-story").innerHTML = '<p class="empty">No eligible opening position to animate. Browse the actual inventory below; no quantities have been invented.</p>';
        }
        const focuses = focusKeys(), focusLow = frame.active_alerts.filter((row) => focuses.has(stockKey(row))).length;
        const other = frame.active_alerts.length - focusLow;
        const unknown = frame.stock.filter((row) => quantityStatus(row.quantity) === "unknown").length;
        if (!UI.payload.inventory.stock_is_known) {
          byId("low-strip").innerHTML = '<strong>Opening stock unknown</strong><span>No low-stock conclusion is available. Missing inventory is not zero.</span>';
          return;
        }
        byId("low-strip").innerHTML = `<strong>${focusLow} focus position${focusLow === 1 ? "" : "s"} below minimum</strong><span>${other} other low-stock positions · ${unknown} unknown</span><span class="muted">Initial low stock is included; serialized items can be intentionally low.</span><button class="text-button" id="show-low" type="button">Inspect low stock →</button>`;
        byId("show-low").onclick = () => { clearFilters(); byId("stock-status").value = "attention"; drawStock(); byId("stock-title").scrollIntoView({ block: "start" }); byId("stock-status").focus({ preventScroll: true }); };
      }

      function drawLocations() {
        const frame = currentFrame();
        const focusedIndex = document.activeElement?.dataset.locationIndex;
        byId("locations").innerHTML = UI.payload.inventory.locations.map((loc, index) => {
          const rows = frame.stock.filter((row) => row.location_id === loc.location_id);
          const low = rows.filter((row) => ["low", "out_of_stock"].includes(quantityStatus(row.quantity))).length;
          const unknown = rows.filter((row) => quantityStatus(row.quantity) === "unknown").length;
          return `<button type="button" class="location-card" data-location-index="${index}" aria-pressed="${UI.location === loc.location_id}"><strong>${esc(loc.location_code)}</strong><small>${esc(humanize(loc.location_type))}${loc.is_mobile ? " · mobile home base" : ""}</small><span class="counts">${UI.payload.inventory.stock_is_known ? `${rows.length} positions · ${low} below min${unknown ? ` · ${unknown} unknown` : ""}` : "Stock unknown"}</span></button>`;
        }).join("") || '<p class="empty">No storeroom locations recorded.</p>';
        byId("locations").querySelectorAll("button").forEach((button) => button.onclick = () => selectLocation(UI.payload.inventory.locations[Number(button.dataset.locationIndex)].location_id));
        if (focusedIndex !== undefined) byId("locations").querySelector(`[data-location-index="${Number(focusedIndex)}"]`)?.focus({ preventScroll: true });
        byId("all-locations").setAttribute("aria-pressed", String(!UI.location));
      }

      function selectLocation(id) {
        UI.location = id;
        UI.selected = "";
        ensureSelectedVisible();
        drawLocations(); drawStock(); drawDetail(); highlightMap();
      }

      function selectStock(key, navigate = false, resetFilters = false) {
        UI.selected = key;
        const row = currentFrame().stock.find((item) => stockKey(item) === key);
        if (row) UI.location = row.location_id;
        if (resetFilters) ["q", "scope", "crit", "stock-status"].forEach((id) => { byId(id).value = ""; });
        ensureSelectedVisible();
        drawLocations(); drawStock(); drawDetail(); highlightMap();
        if (navigate) { byId("detail").scrollIntoView({ block: "nearest" }); byId("detail").focus({ preventScroll: true }); }
      }

      function ensureSelectedVisible() {
        const loc = UI.payload.inventory.locations.find((item) => item.location_id === UI.location);
        if (!loc) return;
        const levels = zoomLevels(MAP.data);
        if (Number(loc.offset_km) > levels[resolveZoom(levels)].cap) {
          MAP.zoom = levels.length - 1;
          byId("mapwrap").innerHTML = drawMap(MAP.data);
          wireZoom(MAP.data);
        }
      }

      function mapSelect(event) {
        const group = event.target.closest(".loc");
        if (!group) return;
        const ids = JSON.parse(group.dataset.locations);
        // Coincident records stay at their true point; successive activations
        // cycle the members while the location rail exposes every choice.
        const next = (ids.indexOf(UI.location) + 1) % ids.length;
        selectLocation(ids[next]);
      }

      function highlightMap() {
        const loc = UI.payload.inventory.locations.find((item) => item.location_id === UI.location);
        let visible = false;
        byId("mapwrap").querySelector("svg.map")?.setAttribute("role", "group");
        byId("mapwrap").querySelectorAll(".loc").forEach((group) => {
          const ids = JSON.parse(group.dataset.locations);
          const selected = ids.includes(UI.location);
          group.classList.toggle("selected", selected);
          visible ||= selected;
          const marker = group.querySelector(".body");
          if (marker) { marker.setAttribute("role", "button"); marker.setAttribute("aria-pressed", String(selected)); }
        });
        byId("map-selection").textContent = loc
          ? `${loc.location_code} selected · ${loc.is_mobile ? "Mobile home base, not a field position. " : ""}${visible ? "Highlighted marker; shared points contain multiple locations. Activate a shared marker again to cycle locations." : "Outside this extent or missing grid position; choose Network to check the full map."}`
          : "All locations shown in the list. Markers and location cards are keyboard accessible. Shared markers cycle their locations.";
      }

      function wireZoom(data) {
        const levels = zoomLevels(data);
        resolveZoom(levels);
        byId("zoom").innerHTML = levels.map((level, index) => `<button type="button" data-zoom="${index}" aria-pressed="${index === MAP.zoom}">${esc(level.name)}</button>`).join("");
        byId("zoom").querySelectorAll("button").forEach((button) => button.onclick = () => {
          MAP.zoom = Number(button.dataset.zoom);
          byId("mapwrap").innerHTML = drawMap(data);
          byId("zoom").querySelectorAll("button").forEach((other) => other.setAttribute("aria-pressed", String(Number(other.dataset.zoom) === MAP.zoom)));
          highlightMap();
        });
      }

      function clearFilters() {
        ["q", "scope", "crit", "stock-status"].forEach((id) => { byId(id).value = ""; });
        selectLocation("");
      }

      function stockRows() {
        const rows = currentFrame().stock.slice();
        const stocked = new Set(rows.map((row) => row.part_master_id));
        // Catalogued parts without a stocked position are still discoverable.
        UI.payload.inventory.parts.filter((part) => !stocked.has(part.part_master_id)).forEach((part) => rows.push({ part_master_id: part.part_master_id, location_id: null, quantity: null }));
        return rows;
      }

      function drawStock() {
        const data = UI.payload.inventory, focuses = focusKeys();
        const term = byId("q").value.trim().toLowerCase(), scope = byId("scope").value, crit = byId("crit").value, status = byId("stock-status").value;
        const parts = new Map(data.parts.map((part) => [part.part_master_id, part]));
        const rows = stockRows().filter((row) => {
          const part = parts.get(row.part_master_id);
          const state = quantityStatus(row.quantity);
          return (!UI.location || row.location_id === UI.location) && (!scope || part.part_scope === scope) &&
            (!crit || part.criticality_class === crit) &&
            (!status || (status === "attention" ? ["low", "out_of_stock"].includes(state) : status === "focus" ? focuses.has(stockKey(row)) : state === status)) &&
            (!term || [part.part_name, part.stock_code, part.part_key, row.location_code].join(" ").toLowerCase().includes(term));
        }).sort((a, b) => compareStockRows(a, b, parts));
        const loc = data.locations.find((item) => item.location_id === UI.location);
        byId("stock-context").textContent = `${loc ? loc.location_code : "All locations"} · ${currentFrame().label} · Each quantity belongs to one part, one location and its stated UOM.`;
        byId("result-count").textContent = `${rows.length} matching ${rows.length === 1 ? "row" : "rows"} · Select a part for fitment, storage and access details.`;
        document.querySelector("#parts tbody").innerHTML = rows.map((row, index) => {
          const part = parts.get(row.part_master_id), key = stockKey(row);
          return `<tr class="${UI.selected === key ? "selected" : ""}"><td><button class="part-button" type="button" data-stock-index="${index}" aria-label="${esc(`${part.part_name} at ${row.location_code || "no recorded location"}; view details`)}">${esc(part.part_name)}</button><br><small class="muted">${esc(part.stock_code)} · ${esc(part.criticality_class || "unknown")}${focuses.has(key) ? ' · <span class="pill focus">Focus</span>' : ""}</small></td>
            <td>${esc(row.location_code || "No stock position recorded")}<br><small class="muted">${esc(humanize(row.location_type))}</small></td><td class="num"><strong>${stockQuantity(row.quantity)}</strong> ${esc(part.uom || "UOM unknown")}</td><td>${statusPill(row.quantity)}</td></tr>`;
        }).join("") || '<tr><td colspan="4" class="empty">No stock matches these filters. Clear filters or choose another location.</td></tr>';
        document.querySelectorAll("[data-stock-index]").forEach((button) => button.onclick = () => selectStock(stockKey(rows[Number(button.dataset.stockIndex)]), true));
      }

      function drawDetail() {
        const data = UI.payload.inventory, row = stockRows().find((item) => stockKey(item) === UI.selected);
        const loc = data.locations.find((item) => item.location_id === (row?.location_id || UI.location));
        const part = data.parts.find((item) => item.part_master_id === row?.part_master_id);
        const held = part ? currentFrame().stock.filter((item) => item.part_master_id === part.part_master_id) : [];
        const field = (label, value) => `<dt>${label}</dt><dd>${value}</dd>`;
        byId("detail").innerHTML = `<div class="eyebrow">The detail, not the guess</div>${part ? '<button class="close" id="close-detail" type="button" aria-label="Close part details">×</button>' : ""}
          <h3>${esc(part?.part_name || loc?.location_code || "Choose a stock position")}</h3>
          ${!part && !loc ? '<p class="sub">Select a part in the list to inspect its exact location, quantity, fitment and storage requirements.</p>' : ""}
          ${part ? `<p class="sub">${esc(part.stock_code)}<br><code>${esc(part.part_key)}</code></p><div style="font-size:24px"><strong>${stockQuantity(row.quantity)}</strong> ${esc(part.uom || "UOM unknown")}</div>${statusPill(row.quantity)}
            <h3>Stock at each location</h3><ul class="held-list">${held.map((item, index) => `<li><button type="button" data-held-index="${index}" aria-pressed="${item.location_id === row.location_id}">${esc(item.location_code)} &middot; <strong>${stockQuantity(item.quantity)} ${esc(part.uom)}</strong></button></li>`).join("") || '<li class="none">No stock position recorded</li>'}</ul>
            <dl>${field("Scope · class · criticality", esc([part.part_scope, part.part_class, part.criticality_class].join(" · ")))}
            ${field("Tracking", esc(humanize(part.tracking_mode)))}
            ${field("Required storage class", esc(humanize(part.required_storage_class)))}
            ${field("Synthetic lead time", `${num(part.nominal_lead_time_days_synthetic)} days · ${esc(humanize(part.lead_band))}`)}
            ${field("Fitment", part.has_fitment && Array.isArray(part.fits) && part.fits.length
              ? `<ul class="fitlist">${part.fits.map((fit) => `<li>${esc(humanize(fit.asset_type))} × ${esc(fit.quantity_per_assembly)}</li>`).join("")}</ul>`
              : `<span class="none">${part.is_site_wide ? "site-wide, " : ""}no fitment recorded</span>`)}
            </dl>` : ""}
          ${loc ? `<dl>${field("Location", `<strong>${esc(loc.location_code)}</strong> · ${esc(humanize(loc.location_type))}${loc.is_mobile ? "<br>Mobile: home base shown, not field position" : ""}`)}
            ${field("Stocking profile", esc(humanize(loc.stocking_profile)))}
            ${field("Location storage address (synthetic)", ["zone", "aisle", "rack", "shelf", "bin_code"].filter((name) => loc[name] !== null && loc[name] !== undefined && loc[name] !== "").map((name) => `${esc(humanize(name))}: ${esc(loc[name])}`).join("<br>") || "No rack or bin metadata recorded")}
            ${field("Access geometry (synthetic)", `${num(loc.route_position_km)} km on corridor<br>${num(loc.offset_km)} km off corridor`)}
            ${field("Supported storage classes", esc((loc.storage_classes_supported || []).map(humanize).join(", ") || "unknown"))}</dl>` : ""}
          ${part && !loc ? '<p class="none">No stocked location recorded; quantity unknown.</p>' : ""}`;
        if (byId("close-detail")) byId("close-detail").onclick = () => { UI.selected = ""; drawStock(); drawDetail(); byId("q").focus(); };
        byId("detail").querySelectorAll("[data-held-index]").forEach((button) => button.onclick = () => selectStock(stockKey(held[Number(button.dataset.heldIndex)]), true, true));
      }

      function alertItem(alert, focus) {
        return `<li><span class="stamp">${esc(alert.quantity)} ${esc(alert.uom)}</span><strong>${esc(alert.part_name)}</strong>${esc(alert.location_code)} · ${esc(humanize(alert.status))}${focus ? ' · <span class="pill focus">Focus</span>' : ""}<br><span class="muted">Minimum ${esc(alert.threshold)} · ${esc(humanize(alert.reason))}</span><details><summary>Preview context</summary><p>Stock code: ${esc(alert.stock_code)}<br>Dataset: <code>${esc(alert.source_dataset)}</code><br>Episode: <code>${esc(alert.alert_id)}</code><br>Latest state: T+${esc(alert.elapsed_minutes)} synthetic min<br>Fictional data; no operational use. Not sent to Azure.</p></details></li>`;
      }

      function drawActivity() {
        const frame = currentFrame(), focuses = focusKeys();
        if (!UI.payload.inventory.stock_is_known) {
          byId("active-alerts").innerHTML = '<p class="empty">Opening stock is unknown. No alert or recovery conclusion is available.</p>';
          byId("activity").innerHTML = '<li class="muted">No movement can be simulated without known opening stock.</li>';
          byId("other-history-count").textContent = "Alert history unavailable";
          byId("other-history").innerHTML = "";
          return;
        }
        const otherOpen = byId("active-alerts").querySelector("details")?.open;
        const focusAlerts = frame.active_alerts.filter((row) => focuses.has(stockKey(row)));
        const otherAlerts = frame.active_alerts.filter((row) => !focuses.has(stockKey(row)));
        byId("active-alerts").innerHTML = `<h3 style="margin-top:12px">Scenario focus · ${focusAlerts.length}</h3><ul class="activity-list">${focusAlerts.map((alert) => alertItem(alert, true)).join("") || '<li class="muted">No active focus alerts at this stage.</li>'}</ul>
          <details ${otherOpen ? "open" : ""} style="margin-top:16px"><summary>Other low-stock positions · ${otherAlerts.length} (includes initial low)</summary><ul class="activity-list">${otherAlerts.map((alert) => alertItem(alert, false)).join("") || '<li class="muted">No other low-stock positions.</li>'}</ul></details>`;
        const history = frameHistory(UI.payload.movement.frames, UI.index);
        const mainHistory = history.filter((event) => event.event_type === "movement" || focuses.has(stockKey(event)));
        const otherHistory = history.filter((event) => event.event_type === "alert" && !focuses.has(stockKey(event)));
        byId("other-history-count").textContent = `Other alert transitions · ${otherHistory.length} (includes initial low)`;
        byId("other-history").innerHTML = otherHistory.map((event) => `<li><span class="stamp">T+${esc(event.elapsed_minutes)} min</span><strong>${esc(event.part_name)} · ${esc(event.state)}</strong>${esc(event.location_code)} · ${num(event.quantity)} ${esc(event.uom)}<br><span class="muted">${esc(humanize(event.reason))} · portal preview only</span></li>`).join("") || '<li class="muted">No other alert transitions.</li>';
        byId("activity").innerHTML = mainHistory.map((event) => {
          if (event.event_type === "movement") return `<li><span class="stamp">T+${esc(event.elapsed_minutes)} min</span><strong>${esc(humanize(event.kind))} · ${esc(event.part_name)}</strong>${esc(event.location_code)} · ${num(event.quantity_before)} → ${num(event.quantity_after)} ${esc(event.uom)} <span class="muted">(${event.delta > 0 ? "+" : ""}${esc(event.delta)})</span><br><span class="muted">${esc(humanize(event.reason))}</span></li>`;
          return `<li><span class="stamp">T+${esc(event.elapsed_minutes)} min</span><strong>Alert ${esc(event.state)} · ${esc(event.part_name)}</strong>${esc(event.location_code)} · ${num(event.quantity)} ${esc(event.uom)}<br><span class="muted">${esc(humanize(event.reason))} · portal preview only</span></li>`;
        }).join("") || '<li class="muted">Opening stock loaded. No scenario movement yet. Initial low-stock previews are listed under Current attention.</li>';
      }

      (async () => {
        const root = document.getElementById("root");
        // The basemap is fetched alongside the data, not before it. It is
        // decoration for facts the dataset already carries, so a failure to
        // load it must cost the reader the ground, never the network: the
        // rejection is swallowed deliberately and drawMap falls back.
        const basemap = fetch("/midstream/review/inventory/basemap.json", {
          headers: { Accept: "application/json" },
        })
          .then((response) => (response.ok ? response.json() : null))
          .catch(() => null);
        try {
          const response = await fetch("/api/midstream/review/inventory/movement", {
            headers: { Accept: "application/json" },
          });
          if (!response.ok) {
            const detail = await response.json().catch(() => ({}));
            root.innerHTML = `<div class="err" role="alert"><strong>Inventory unavailable.</strong>
              ${esc(detail.message || "Generate a midstream dataset first.")}</div>`;
            return;
          }
          const data = await response.json();
          MAP.basemap = await basemap;
          render(data);
        } catch (error) {
          root.innerHTML = `<div class="err" role="alert"><strong>Inventory unavailable.</strong> ${esc(
            error.message
          )}</div>`;
        }
      })();
    </script>
  </body>
</html>
